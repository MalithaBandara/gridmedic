[project]
name = "gridmedic"
version = "0.1.0"
description = "GridMedic: turns a storm's flood of power-outage complaints into a ranked, safe action plan"
entry-point = "main.jac"
kind = "fullstack"

[dependencies]
byllm = "*"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

[byllm.model]
default_model = "gemini/gemini-3.5-flash-lite"

[plugins.byllm.model]
default_model = "gemini/gemini-3.5-flash-lite"

[scripts]
# One process per test file: files in a single `jac test -d tests/` run share one
# persisted graph and interfere. Stop any dev server first (jac clean needs the db).
test = "jac clean --all --force && jac test tests/acceptance_tests.jac && jac clean --all --force && jac test tests/noise_tests.jac && jac clean --all --force && jac test tests/dispatch_tests.jac && jac clean --all --force && jac test tests/energise_tests.jac && jac clean --all --force && jac test tests/microgrid_tests.jac && jac clean --all --force && jac test tests/safety_tests.jac"

